name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: tracking-core + tracking-eval (no system deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy -p tracking-core -p tracking-eval --all-targets -- -D warnings

      - name: test
        run: cargo test -p tracking-core -p tracking-eval

      - name: eval harness
        run: cargo run -p tracking-eval --bin eval

  cv:
    name: tracking-cv (real OpenCV CSRT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: install libclang-18 + OpenCV (+ contrib) dev packages
        run: |
          sudo apt-get update
          # Pinned to the -18 package explicitly (not the unversioned
          # libclang-dev meta-package): a floating version pull was observed
          # to produce a libclang.so whose exported symbols didn't match
          # what the `clang`/`clang-sys` crates were compiled against
          # (rust-lld "undefined symbol: clang_EvalResult_getAsStr" and
          # friends) even though the same package family works locally.
          sudo apt-get install -y libclang-18-dev libopencv-dev

      - name: locate libclang.so (Ubuntu ships it as libclang-N.so, not libclang.so)
        run: |
          set -euo pipefail
          real="$(find /usr/lib -iname 'libclang-18.so*' | sort -V | tail -1)"
          test -n "$real"
          mkdir -p "$HOME/.local/libclang-shim"
          ln -sf "$real" "$HOME/.local/libclang-shim/libclang.so"
          echo "LIBCLANG_PATH=$HOME/.local/libclang-shim" >> "$GITHUB_ENV"

      - name: clippy
        run: cargo clippy -p tracking-cv --all-targets -- -D warnings

      - name: test
        run: cargo test -p tracking-cv
